<script>
/* ---------- mini-harness ---------- */
const TESTS=[];
function test(name,fn){TESTS.push([name,fn])}
function fmt(v){try{return JSON.stringify(v)}catch(e){return String(v)}}
function eq(a,b,msg){if(fmt(a)!==fmt(b))throw new Error((msg?msg+": ":"")+"forventede "+fmt(b)+", fik "+fmt(a))}
function ok(c,msg){if(!c)throw new Error(msg||"forventede sand")}
const tick=(ms=0)=>new Promise(r=>setTimeout(r,ms));
const fakeDoc=(id,data)=>({id,data:()=>data});

/* ---------- falsk backend ---------- */
window.__writes=[];window.__snap=null;window.__canWrite=true;
const fakeDb={
  collection:()=>({
    onSnapshot:(cb)=>{window.__snap=cb;return()=>{}},
    doc:id=>({set:async d=>{window.__writes.push({op:"set",path:"projects/"+id,p:d})}})
  }),
  doc:path=>({
    update:async p=>{window.__writes.push({op:"update",path,p})},
    delete:async()=>{window.__writes.push({op:"delete",path})}
  })
};
const fakeUser={id:async()=>"me",can:async()=>window.__canWrite!==false,me:async()=>({name:"Test"}),profiles:async()=>({})};
window.DDP_BACKEND={use:async n=>n==="db"?fakeDb:n==="user"?fakeUser:null};

async function runAll(){
  await tick(20);
  const out=[];let fail=0;
  for(const [name,fn] of TESTS){
    try{await fn();out.push("ok   "+name)}
    catch(e){fail++;out.push("FEJL "+name+" — "+(e&&e.message))}
  }
  out.push(fail?`FEJL: ${fail} af ${TESTS.length}`:`ALLE ${TESTS.length} TESTS BESTÅET`);
  document.getElementById("results").textContent=out.join("\n");
}
</script>

/* HTTP-backend mod FastAPI */
async function withFetch(handler, fn){
  const real = window.fetch, calls = [];
  window.fetch = async (url, opt) => { calls.push({url, method:(opt&&opt.method)||"GET", body:opt&&opt.body}); return handler(url, opt); };
  try { await fn(calls); } finally { window.fetch = real; }
}
const jsonRes = (data, status=200) => ({ok:status<400, status, json:async()=>data, text:async()=>JSON.stringify(data)});
test("http: update sender PATCH med JSON", async () => withFetch(() => jsonRes({ok:true}), async calls => {
  const db = await DDP.httpBackend().use("db");
  await db.doc("projects/abc").update({name:"X"});
  const c = calls.find(c => c.method === "PATCH");
  eq(c.url, "api/projects/abc"); eq(JSON.parse(c.body), {name:"X"});
}));
test("http: onSnapshot leverer projekter fra serveren", async () => withFetch(() => jsonRes({p1:{name:"Lager"}}), async () => {
  const db = await DDP.httpBackend().use("db");
  let snap = null; const stop = db.collection("projects").onSnapshot(s => { snap = s; });
  await tick(10); stop();
  eq(snap.docs.map(d => [d.id, d.data().name]), [["p1","Lager"]]);
  eq(snap.metadata.fromCache, false);
}));
test("http: ingen server giver ingen database", async () => withFetch(() => { throw new TypeError("Failed to fetch"); }, async () => {
  eq(await DDP.httpBackend().use("db"), null);
}));
test("http: netværksfejl ved skrivning giver koden unavailable", async () => withFetch(u => { if (String(u).endsWith("api/projects")) return jsonRes({}); throw new TypeError("x"); }, async () => {
  const db = await DDP.httpBackend().use("db");
  let code = null; try { await db.doc("projects/a").update({}); } catch (e) { code = e.code; }
  eq(code, "unavailable");
}));
test("http: navn gemmes på serveren", async () => withFetch(() => jsonRes({ok:true}), async calls => {
  const u = await DDP.httpBackend().use("user");
  await u.setName("Mette");
  const c = calls.find(c => c.method === "PUT");
  ok(/^api\/users\/[A-Za-z0-9_-]+$/.test(c.url), c.url); eq(JSON.parse(c.body), {name:"Mette"});
  eq((await u.me()).name, "Mette");
}));

  eq(c.build, 16000); eq(Math.round(c.paybackMonths*100)/100, Math.round(16000/78400*12*100)/100);
  ok(!("life" in c) && !("buildYear" in c) && !("est" in c), "levetidsfelter er væk");
});

});
