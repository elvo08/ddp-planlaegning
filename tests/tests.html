<!DOCTYPE html>
<html lang="da">
<head><meta charset="utf-8"><title>DDP-tests</title></head>
<body>
<header><span id="crumb"></span><span id="mode"></span><span id="who"></span></header>
<main><div id="app"></div></main>
<div id="toast"></div>
<pre id="results">Kører …</pre>

<script>
/* ---------- mini-harness ---------- */
const TESTS=[];
function test(name,fn){TESTS.push([name,fn])}
function fmt(v){try{return JSON.stringify(v)}catch(e){return String(v)}}
function eq(a,b,msg){if(fmt(a)!==fmt(b))throw new Error((msg?msg+": ":"")+"forventede "+fmt(b)+", fik "+fmt(a))}
function ok(c,msg){if(!c)throw new Error(msg||"forventede sand")}
const tick=(ms=0)=>new Promise(r=>setTimeout(r,ms));
const fakeDoc=(id,data)=>({id,data:()=>data});

/* ---------- falsk claude-runtime ---------- */
window.__writes=[];window.__snap=null;window.__canWrite=true;
const fakeDb={
  collection:()=>({
    onSnapshot:(cb)=>{window.__snap=cb;return()=>{}},
    doc:id=>({set:async d=>{window.__writes.push({op:"set",path:"projects/"+id,p:d})}})
  }),
  doc:path=>({
    update:async p=>{window.__writes.push({op:"update",path,p})},
    delete:async()=>{window.__writes.push({op:"delete",path})}
  })
};
const fakeUser={id:async()=>"me",can:async()=>window.__canWrite!==false,me:async()=>({name:"Test"}),profiles:async()=>({})};
window.claude={use:async n=>n==="db"?fakeDb:n==="user"?fakeUser:null};

async function runAll(){
  await tick(20);
  const out=[];let fail=0;
  for(const [name,fn] of TESTS){
    try{await fn();out.push("ok   "+name)}
    catch(e){fail++;out.push("FEJL "+name+" — "+(e&&e.message))}
  }
  out.push(fail?`FEJL: ${fail} af ${TESTS.length}`:`ALLE ${TESTS.length} TESTS BESTÅET`);
  document.getElementById("results").textContent=out.join("\n");
}
</script>
<script src="../src/demo.js"></script>
<script src="../src/app.js"></script>
<script>
/* ---------- tests ---------- */
test("appen starter i live med database", async () => {
  await tick();
  window.__snap({docs:[], size:0, metadata:{fromCache:false}});
  eq(DDP.state().mode, "live");
});

/* Task 2: demo/live */
test("skift til demo viser demoprojekter og skriver ikke til db", async () => {
  DDP.setMode("demo");
  const id = Object.keys(DDP.state().projects)[0];
  ok(id, "der findes demoprojekter");
  window.__writes.length = 0;
  DDP.queuePatch(id, {name:"Ændret"}, 0); DDP.flushAll(); await tick();
  eq(window.__writes.length, 0, "ingen db-skrivninger i demo");
  eq(DDP.state().projects[id].name, "Ændret");
});
test("ventende live-ændring gemmes før skift til demo", async () => {
  DDP.setMode("live");
  window.__snap({docs:[fakeDoc("L1",{name:"Live"})], size:1, metadata:{fromCache:false}});
  window.__writes.length = 0;
  DDP.queuePatch("L1", {name:"Live 2"});
  DDP.setMode("demo"); await tick();
  eq(window.__writes.length, 1); eq(window.__writes[0].path, "projects/L1");
  ok(!("L1" in DDP.state().projects), "live-projekt vises ikke i demo");
});
test("live-snapshot i demo ændrer ikke det viste", () => {
  DDP.setMode("demo");
  window.__snap({docs:[fakeDoc("L2",{name:"Ny"})], size:1, metadata:{fromCache:false}});
  ok(!("L2" in DDP.state().projects)); ok("L2" in DDP.state().liveProjects);
});
test("læseadgang: må redigere i demo, ikke i live", () => {
  window.__canWrite = false; DDP.setCanWrite(false);
  DDP.setMode("demo"); eq(document.querySelector("fieldset.all").disabled, false);
  DDP.setMode("live"); eq(document.querySelector("fieldset.all").disabled, true);
  DDP.setCanWrite(true); window.__canWrite = true;
});
test("#demo i adressen åbner demo", () => { DDP.setMode("live"); DDP.readHashFrom("#demo-katalog"); eq(DDP.state().mode, "demo"); });
test("banner vises kun i demo", () => {
  DDP.setMode("demo"); ok(document.getElementById("app").textContent.includes("Du ser demodata. Ændringer gemmes ikke."));
  DDP.setMode("live"); ok(!document.getElementById("app").textContent.includes("Du ser demodata."));
});
test("skiftet i toppen viser aktiv visning", () => {
  DDP.setMode("demo");
  eq(document.querySelector('[data-act="mode"][data-mode="demo"]').getAttribute("aria-pressed"), "true");
  DDP.setMode("live");
});

/* Task 3: bygget-fanen og I drift */
const ms = (dec, at) => ({m1:{decision:dec, decidedAt:at, name:"x"}});
test("I drift erstatter Fortsætter", () => eq(DDP.status({milestones:ms("fortsaet",1), build:{live:true}}), ["I drift","ok"]));
test("I drift erstatter ikke Justeres", () => eq(DDP.status({milestones:ms("juster",1), build:{live:true}})[0], "Justeres"));
test("I drift erstatter ikke Under planlægning", () => eq(DDP.status({build:{live:true}})[0], "Under planlægning"));
test("projekt uden build virker", () => eq(DDP.status({milestones:ms("fortsaet",1)})[0], "Fortsætter"));
test("allStackTags samler stavemåder", () => eq(DDP.allStackTags({a:{build:{stack:["Python","Shopify API"]}}, b:{build:{stack:["python"]}}, c:{}}), ["Python","Shopify API"]));
test("addTag afviser dublet med andre bogstaver", async () => {
  DDP.setMode("demo"); const id = Object.keys(DDP.state().projects)[0];
  DDP.addTag(id, "Python"); DDP.addTag(id, " python "); DDP.addTag(id, "");
  eq(DDP.state().projects[id].build.stack.filter(t=>t.toLowerCase()==="python").length, 1);
  DDP.removeTag(id, "Python"); ok(!DDP.state().projects[id].build.stack.includes("Python"));
});
test("fanen bygget vises med felterne", () => {
  DDP.setMode("demo"); const id = Object.keys(DDP.state().projects)[0];
  DDP.readHashFrom("#demo-p-"+id+"-bygget"); DDP.render();
  const t = document.getElementById("app").textContent;
  ["Hvad værktøjet gør","Tech stack","Dele andre kan genbruge","Links","Læring og faldgruber","Kontaktperson","Værktøjet er i drift"].forEach(l => ok(t.includes(l), l));
  DDP.setMode("live");
});

/* Task 4: katalog */
const CP = {
  a:{name:"Lager", department:"Indkøb", updatedAt:2, build:{summary:"Rapport", stack:["Python"]}},
  b:{name:"Tom", department:"HR", updatedAt:3, build:{summary:"  ", stack:[]}},
  c:{name:"Gammel", department:"Indkøb", updatedAt:1},
  d:{name:"Tekster", department:"Marketing", updatedAt:4, build:{stack:["Claude API"], learnings:"Brug skabelon"}}
};
test("katalog: kun dokumenterede, nyeste først", () => eq(DDP.catalogItems(CP,{}).map(x=>x.id), ["d","a"]));
test("katalog: filter afdeling", () => eq(DDP.catalogItems(CP,{dep:"Indkøb"}).map(x=>x.id), ["a"]));
test("katalog: filter teknologi uden hensyn til bogstaver", () => eq(DDP.catalogItems(CP,{tech:"claude api"}).map(x=>x.id), ["d"]));
test("katalog: fritekst i læring", () => eq(DDP.catalogItems(CP,{q:"skabelon"}).map(x=>x.id), ["d"]));
test("katalog-fanen og hash", () => {
  DDP.setMode("live"); DDP.readHashFrom("#demo-katalog"); DDP.render();
  eq(DDP.state().mode, "demo"); eq(DDP.state().view.home, "katalog");
  ok(document.getElementById("app").textContent.includes("Værktøjskatalog"));
  DDP.setMode("live");
});

runAll();
</script>
</body>
</html>
